name: CI

on:
  # Only main on push: a branch with an open pull request would otherwise run
  # the whole matrix twice for one commit.
  push:
    branches: [main]
  pull_request:

jobs:
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Assert the core has no CLI or server stack
        run: |
          python - <<'PY'
          import importlib.util
          for package in ("fastapi", "uvicorn", "typer", "rich"):
              assert importlib.util.find_spec(package) is None, package
          PY
      - name: Import, select, and compile with the core only
        run: |
          python - <<'PY'
          from prompt_playoff import PromptCompiler, Registry, Selector, normalize_description
          from prompt_playoff.domain import ModelProfile, TaskProfile, TaskType

          registry = Registry.load()
          task = TaskProfile(task_type=TaskType.structured_extraction, model=ModelProfile())
          technique = registry.technique("direct.explicit-constraints")
          Selector(registry).select(task)
          normalize_description("Extract entities.", task.model)
          PromptCompiler().compile(task, technique, "Mara entered Veyr.")
          PY
      - name: Console command explains how to install the CLI
        run: |
          if prompt-playoff >message.txt 2>&1; then exit 1; fi
          grep -F "pip install 'prompt-playoff[cli]'" message.txt

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Windows differs where it can actually break: file locking goes
          # through msvcrt instead of fcntl, paths are not POSIX, and the
          # default text encoding is not UTF-8. One interpreter catches that.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      # API and CLI tests run with their declared extras; core-only is isolated above.
      - run: pytest
      - run: prompt-playoff validate-registry --strict
      - name: Audit publication metadata and local documentation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/audit_publication.py

  check-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[cli]'
      - name: Exercise the gate against a deterministic provider
        env:
          PROMPT_PLAYOFF_API_KEY: ci-only-not-a-secret
        run: |
          python tests/fake_provider_server.py &
          provider_pid=$!
          trap 'kill "$provider_pid"' EXIT
          for attempt in {1..50}; do
            if python -c "import socket; socket.create_connection(('127.0.0.1', 18765), 0.2).close()"; then
              break
            fi
            sleep 0.1
          done
          prompt-playoff check --config tests/fixtures/check-ci.yaml --no-record

  windows-serve:
    # The README tells Windows users to double-click start.bat and get a web
    # interface. That claim is only worth making if the server is known to come
    # up there, so this starts it and requires an answer.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[cli,serve]
      - name: Serve, then require /health
        shell: pwsh
        run: |
          $server = Start-Process -PassThru python `
            -ArgumentList '-m', 'prompt_playoff', 'serve', '--port', '8123'
          try {
            $answered = $false
            foreach ($attempt in 1..60) {
              try {
                Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8123/health' -TimeoutSec 2 |
                  Out-Null
                $answered = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $answered) { throw 'the server never answered /health' }
          } finally {
            Stop-Process -InputObject $server -Force
          }

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,dspy,tracing]'
      - run: pytest tests/test_integrations.py -q
