name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require the tag to match package versions
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          package = re.search(r'__version__ = "([^"]+)"', pathlib.Path("src/prompt_playoff/__init__.py").read_text()).group(1)
          assert tag == project == package, (tag, project, package)
          PY
      - run: python -m pip install --upgrade build twine cyclonedx-bom '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: prompt-playoff validate-registry --strict
      - run: python scripts/audit_publication.py --check-links
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Audit the exact wheel and create release metadata
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python scripts/audit_publication.py --artifact "$wheel"
          mkdir -p release-artifacts
          shasum -a 256 dist/* > release-artifacts/SHA256SUMS
          cyclonedx-py environment --output-format JSON --output-file "release-artifacts/prompt-playoff-${GITHUB_REF_NAME#v}.cdx.json"
      - name: Create a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* release-artifacts/* --draft --verify-tag --generate-notes --title "Prompt Playoff $GITHUB_REF_NAME"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Publish the GitHub Release after PyPI succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
