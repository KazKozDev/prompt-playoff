<!doctype html>
<meta charset="utf-8">
<title>social</title>
<style>
  /* The interface's own tokens, so the card and the app look like one thing. */
  :root {
    --bg:#0f1115; --text:#f3f4f6; --muted:#9ca3af; --line:#3d4453; --accent:#f6c344;
    --sans: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    width:1280px; height:640px; background:var(--bg); color:var(--text);
    font-family:var(--sans); overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:space-between; padding:0 92px;
  }
  .glow {
    position:absolute; right:0; top:50%; transform:translateY(-50%);
    width:700px; height:700px; pointer-events:none;
    background:radial-gradient(circle, rgba(246,195,68,.10) 0%, rgba(246,195,68,0) 62%);
  }
  h1 { font-size:92px; font-weight:800; letter-spacing:-.05em; line-height:1; }
  .rule { width:64px; height:4px; margin:34px 0; border-radius:2px; background:var(--accent); }
  p { color:var(--muted); font-size:26px; line-height:1.4; letter-spacing:-.01em; max-width:470px; }
  svg { position:relative; flex:none; }
</style>

<div class="glow"></div>

<section>
  <h1>Prompt<br>Playoff</h1>
  <div class="rule"></div>
  <p>Prompt optimization and LLM evaluation for local models</p>
</section>
