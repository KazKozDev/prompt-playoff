<!doctype html>
<meta charset="utf-8">
<title>social</title>
<style>
  /* The interface's own tokens, so the card and the app look like one thing. */
  :root {
    --bg:#0f1115; --text:#f3f4f6; --muted:#9ca3af; --accent:#f6c344;
    --sans: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    width:1280px; height:640px; background:var(--bg); color:var(--text);
    font-family:var(--sans); overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  h1 {
    font-size:104px; font-weight:800; letter-spacing:-.05em; line-height:1;
  }
  /* One accent mark, sized to the descender of the word above it. */
  .rule {
    width:64px; height:4px; margin:38px 0; border-radius:2px; background:var(--accent);
  }
  p {
    color:var(--muted); font-size:27px; line-height:1.4; letter-spacing:-.01em;
    text-align:center; max-width:840px;
  }
</style>

<h1>Prompt Playoff</h1>
<div class="rule"></div>
<p>Prompt optimization and LLM evaluation for local models</p>
