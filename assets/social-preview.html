<!doctype html>
<meta charset="utf-8">
<title>social</title>
<style>
  /* The interface's own tokens and its own tab styling, scaled up: the card
     is a piece of the product rather than a drawing of it. */
  :root {
    --bg:#0f1115; --text:#f3f4f6; --muted:#9ca3af; --border:#2a2f3a; --accent:#f6c344;
    --sans: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    width:1280px; height:640px; background:var(--bg); color:var(--text);
    font-family:var(--sans); overflow:hidden; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  /* Everything inside the centre two thirds: the platforms that show this
     image each crop it to a different aspect ratio. */
  main {
    position:relative; width:845px;
    display:flex; flex-direction:column; align-items:center;
  }
  h1 { font-size:108px; font-weight:800; letter-spacing:-.05em; line-height:1; }
  .tabs { display:flex; gap:16px; margin-top:52px; }
  .tab {
    padding:18px 34px; border:2px solid var(--border); border-radius:14px;
    color:var(--muted); font-size:28px; font-weight:600; letter-spacing:-.01em;
  }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#111; font-weight:700; }
</style>

<main>
  <h1>Prompt Playoff</h1>
  <div class="tabs">
    <span class="tab active">Authoring</span>
    <span class="tab">Benchmarking</span>
    <span class="tab">Optimization</span>
  </div>
</main>
