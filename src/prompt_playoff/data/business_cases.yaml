# The packaged benchmarks outside the business shelf that a taxonomy task is
# allowed to route to.  A task's `dataset` has to name either one of these or
# one of the `sets` below, so a mistyped name is refused at load time instead of
# quietly rendering as "No dataset".
benchmark_sets:
  - entity-extraction
  - grounded-qa
  - mbpp
  - summarization
  - translation

# The Dataset Library's primary navigation contract.  Every task in the
# approved business directory stays visible; `dataset` is present only when a
# packaged set measures the same input -> output shape closely enough to be an
# honest route.  Availability is added by business_catalog.py at request time.
