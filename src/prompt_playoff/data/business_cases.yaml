# Fifty things businesses actually pay an LLM to do, and the public dataset that
# measures each one.
#
# The point of this file is that a score should be about work someone is paid
# for. "0.82 on summarization" says nothing; "0.82 on the transcript-to-minutes
# task Ocado Retail runs" says what will break when it drops.
#
# Three columns matter, and they are the three the mapping cannot fudge:
#   direct   the public set is the same input -> output shape as the business
#            case, and a score on it transfers.
#   partial  the set is a useful component or a near neighbour — a support
#            corpus for a support case — and a score on it is evidence, not proof.
#   none     no public set was found in the same shape. Said out loud rather
#            than filled with the closest thing to hand, because a benchmark
#            that does not match the work is worse than no benchmark.
#
# The company named on a case is a real reported user of an LLM for that work.
# It is not the source of the data: every set below is public, and none of it
# came from the company named beside it.
#
# `claim` is the figure that company or its vendor published — 4 hours down to
# 1, eight weeks down to eight hours. It is repeated here because it is what
# makes the case concrete, and it is labelled `claim` because that is what it
# is: a number from a customer story, not a measurement, and nothing in this
# tool has checked one of them. The tool's own numbers are the ones on the
# Measurement screen. Most cases carry no figure at all, which is left as it
# is rather than filled in.
#
# `sets` is both the catalogue the library screen reads and the manifest
# scripts/fetch_business_datasets.py downloads from. Change a column or a split
# here, re-run the script, and the bundled rows follow.

version: 2

