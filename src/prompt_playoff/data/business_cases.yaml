# --------------------------------------------------------------------------- #
# The sets themselves.
#
# `rows` is what the bundled file holds, not what the source holds: these are
# samples big enough to rank two prompts against each other and small enough to
# ship. `max_input_chars` drops rows that are too long rather than truncating
# them, because half a transcript with the whole summary as its answer is an
# impossible task, not a hard one.
# `graders` is what a set declares out loud. `contract` is the second half of
# the same answer, and the one that decides whether the set can be gated at all:
# it names what shape of work the rows hold — `reply`, `summary` or `draft` — so
# `scripts/fetch_business_datasets.py` can derive, per row, the requirements a
# rule can decide. Those are the checks that need no reference answer: the order
# reference carried back into the reply, the unfilled `[INSERT NAME]` that must
# not ship, the length the channel allows. A derived requirement is kept only
# when the human answer already meets it, so nothing here can mark a model wrong
# for answering as well as the person did.
# --------------------------------------------------------------------------- #

