# --------------------------------------------------------------------------- #
# Named in the mapping, not bundled. Each of these is the right dataset for the
# case it is cited on and the wrong dataset to ship here — the reason is on the
# row, so the citation stays checkable without pretending the rows are present.
# --------------------------------------------------------------------------- #

references:
  - id: enron-emails
    title: Enron Emails
    url: https://huggingface.co/datasets/corbt/enron-emails
    why: >-
      Half a million real corporate emails, with no task on them. The
      body-to-subject task it is usually cut into is what business:email-subject
      already measures, on a set cut for exactly that.
  - id: ami-meeting-corpus
    title: AMI Meeting Corpus
    url: https://huggingface.co/datasets/edinburghcstr/ami
    why: >-
      Meeting audio. The transcript is the input a prompt gets, and
      business:meeting-summary is that layer without the hundred hours of speech.
  - id: dialogstudio
    title: DialogStudio
    url: https://huggingface.co/datasets/Salesforce/dialogstudio
    why: Gated — it needs Hub credentials, so it cannot ship inside a package.
  - id: rvl-cdip
    title: RVL-CDIP
    url: https://huggingface.co/datasets/aharley/rvl_cdip
    why: >-
      400,000 scanned pages in 16 classes, as images. Routing them is a vision
      task; nothing here sends an image to a model.
  - id: sroie
    title: SROIE
    url: https://huggingface.co/datasets/darentang/sroie
    why: >-
      Scanned receipts. The OCR-text layer of the same job is what
      business:invoice-fields measures.
  - id: cord
    title: CORD
    url: https://huggingface.co/datasets/naver-clova-ix/cord-v2
    why: >-
      Receipt photographs with semantic fields. Same reason as SROIE: the input
      is a picture, not text.
