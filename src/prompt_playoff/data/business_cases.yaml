# --------------------------------------------------------------------------- #
# The sets themselves.
#
# `rows` is what the bundled file holds, not what the source holds: these are
# samples big enough to rank two prompts against each other and small enough to
# ship. `max_input_chars` drops rows that are too long rather than truncating
# them, because half a transcript with the whole summary as its answer is an
# impossible task, not a hard one.
# --------------------------------------------------------------------------- #

sets:
  - name: business:email-reply
    title: Email thread to reply
    shape: An email thread as it arrived; the reply a person actually sent.
    source: snap-stanford/humanual-email
    url: https://huggingface.co/datasets/snap-stanford/humanual-email
    license: cc-by-nc-4.0
    config: default
    split: test
    fetch: chat_reply
    rows: 60
    max_input_chars: 6000
    min_expected_chars: 80
    graders: [token_f1]
  - name: business:email-subject
    title: Email to subject line
    shape: The body of a work email; the subject line its author wrote.
    source: Yale-LILY/aeslc
    url: https://huggingface.co/datasets/Yale-LILY/aeslc
    license: unspecified by the publisher
    config: default
    split: test
    fetch: column
    input: email_body
    expected: subject_line
    rows: 60
    max_input_chars: 6000
    graders: [token_f1]
  - name: business:marketing-email
    title: Subject line to marketing email
    shape: The subject line of a marketing email; the body that was sent under it.
    source: marketeam/Marketing-Emails
    url: https://huggingface.co/datasets/marketeam/Marketing-Emails
    license: mit
    config: default
    split: train
    fetch: subject_body
    rows: 60
    max_input_chars: 400
    graders: [token_f1]
  - name: business:meeting-summary
    title: Meeting transcript to minutes
    shape: The transcript of a city-council meeting; the minutes written from it.
    source: huuuyeah/meetingbank
    url: https://huggingface.co/datasets/huuuyeah/meetingbank
    license: cc-by-nc-sa-4.0
    config: default
    split: test
    fetch: column
    input: transcript
    expected: summary
    rows: 50
    max_input_chars: 9000
    graders: [token_f1]
  - name: business:meeting-translation
    title: Live translation, English to German
    shape: An utterance in English; the same line in German.
    source: Helsinki-NLP/opus-100
    url: https://huggingface.co/datasets/Helsinki-NLP/opus-100
    license: unspecified by the publisher
    config: de-en
    split: test
    fetch: translation
    translation_from: en
    translation_to: de
    rows: 60
    max_input_chars: 1200
    graders: [token_f1]
  - name: business:support-reply
    title: Support question to answer
    shape: A customer's question to a support desk; the answer the desk gives.
    source: bitext/Bitext-customer-support-llm-chatbot-training-dataset
    url: https://huggingface.co/datasets/bitext/Bitext-customer-support-llm-chatbot-training-dataset
    license: cdla-sharing-1.0
    config: default
    split: train
    fetch: column
    input: instruction
    expected: response
    rows: 60
    max_input_chars: 2000
    graders: [token_f1]
  - name: business:support-intent
    title: Support question to intent
    shape: The same questions, routed — one of 27 support intents per question.
    source: bitext/Bitext-customer-support-llm-chatbot-training-dataset
    url: https://huggingface.co/datasets/bitext/Bitext-customer-support-llm-chatbot-training-dataset
    license: cdla-sharing-1.0
    config: default
    split: train
    fetch: column
    input: instruction
    expected: intent
    rows: 60
    max_input_chars: 2000
    graders: [label_accuracy, exact_match]
  - name: business:retail-support
    title: Retail question to intent
    shape: A shopper's question about an order or a cart; the intent behind it.
    source: bitext/Bitext-retail-ecommerce-llm-chatbot-training-dataset
    url: https://huggingface.co/datasets/bitext/Bitext-retail-ecommerce-llm-chatbot-training-dataset
    license: cdla-sharing-1.0
    config: default
    split: train
    fetch: column
    input: instruction
    expected: intent
    rows: 60
    max_input_chars: 2000
    graders: [label_accuracy, exact_match]
  - name: business:banking-intent
    title: Banking question to intent
