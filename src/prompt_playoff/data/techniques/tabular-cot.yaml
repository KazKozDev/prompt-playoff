id: reasoning.tabular-cot
version: 1.0.0
title: Tabular chain of thought
family: tabular-reasoning
description: Force the reasoning trace into a markdown table with one row per step, so every step
  carries a stated operation and result.
strong_tasks:
- coding
- structured_extraction
acceptable_tasks:
- research
- classification
avoid_tasks:
- creative_writing
suits:
- computational
- verifiable
required_capabilities:
- system_messages
model_classes:
- medium
- large
- reasoning
min_calls: 1
tools_required: false
strict_json_fit: false
validation_fit: true
characteristics:
  quality: 0.81
  reliability: 0.85
  latency_efficiency: 0.72
  token_efficiency: 0.62
  simplicity: 0.8
recipe:
  system: Every reasoning step is a table row with a stated operation and its result.
  instructions:
  - Fill one row per step.
  - State the operation, not a narration of it.
  - Give the final answer under the table.
  blocks:
  - name: role
    title: OBJECTIVE
    body: 'Complete this {task_type} task.

      '
  - name: input
    title: INPUT
    body: '{input}

      '
  - name: procedure
    title: PROCEDURE
    body: 'Reason in a markdown table with exactly these columns:


      | step | subquestion | operation | result |


      One row per step. `operation` is the concrete thing done — an arithmetic expression, a lookup, a
      comparison — not a sentence describing it. `result` is that operation carried out.

      A row may only use results from rows above it. When the table is complete, write the final
      answer on its own line below it, prefixed with `Answer:`.

      '
  - name: contract_native
    title: OUTPUT CONTRACT
    when: native_schema
    body: 'The response is constrained by a schema enforced by the runtime. Emit the object only, with
      no wrapper text.

      '
  - name: contract_embedded
    title: OUTPUT CONTRACT
    when: embedded_schema
    body: 'Return one JSON document that validates against this schema:

      {schema_json}

      Emit the JSON only. No prose, no code fences, no trailing commentary.

      '
  - name: fields
    title: FIELDS
    when: has_schema
    body: '{schema_fields}

      '
  validators:
  - json_validity
  - json_schema
  fallback: Rebuild the table from the first row whose result does not follow.
execution:
  strategy: single
benchmark_priors:
  default: 0.73
  task:coding: 0.82
  task:structured_extraction: 0.78
evidence_level: documented
tags:
- prompt-report
source:
  paper: Tabular Representation, Noisy Operators, and Impacts on Table Structure Understanding Tasks
  authors: Ziqi & Lu
  url: https://arxiv.org/abs/2305.17812
  year: 2023
