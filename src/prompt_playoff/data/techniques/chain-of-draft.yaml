version: 1.0.0
acceptable_tasks:
- structured_extraction
- summarization
avoid_tasks: []
suits:
- computational
- verifiable
required_capabilities:
- system_messages
model_classes:
- small
- medium
- large
- reasoning
tools_required: false
strict_json_fit: true
validation_fit: true
evidence_level: documented
tags:
- prompt-report
- token-efficient
id: reasoning.chain-of-draft
title: Chain of draft
family: thought-generation
description: Reason in clipped drafts of a few words per step instead of full prose. Aims at chain-of-thought
  quality at a fraction of the tokens (arXiv 2502.18600).
strong_tasks:
- coding
- classification
- research
min_calls: 1
characteristics:
  quality: 0.82
  reliability: 0.82
  latency_efficiency: 0.82
  token_efficiency: 0.86
  simplicity: 0.82
recipe:
  system: Think in shorthand. The draft is scaffolding, not an explanation.
  instructions:
  - Draft each reasoning step in at most five words.
  - Answer from the draft.
  blocks:
  - name: procedure
    title: DRAFT
    body: 'Think step by step, but write each step as a minimal note of at most five words. No sentences,
      no explanation, no restating the input. One note per line. Do not answer inside the notes.

      '
  - name: input
    title: INPUT
    body: '{input}

      '
  - name: answer_task
    title: ANSWER
    body: 'After the notes, on a new line, give the answer alone. Do not repeat the notes and do not
      explain them.

      '
  - name: contract_native
    title: OUTPUT CONTRACT
    when: native_schema
    body: 'The response is constrained by a schema enforced by the runtime. Emit the object only, with
      no wrapper text.

      '
  - name: contract_embedded
    title: OUTPUT CONTRACT
    when: embedded_schema
    body: 'Return one JSON document that validates against this schema:

      {schema_json}

      Emit the JSON only. No prose, no code fences, no trailing commentary.

      '
  - name: fields
    title: FIELDS
    when: has_schema
    body: '{schema_fields}

      '
  validators:
  - json_validity
  - json_schema
  fallback: Re-answer from the same notes, obeying the format.
execution:
  strategy: single
benchmark_priors:
  default: 0.75
  task:coding: 0.83
  task:classification: 0.8
source:
  paper: 'Chain of Draft: Thinking Faster by Writing Less'
  authors: Xu et al.
  url: https://arxiv.org/abs/2502.18600
  year: 2025
