<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Prompt Playoff">
  <title>Prompt Playoff</title>
  <!--
    The ball, in the launcher's two colours: gold leather, the seams and the
    pentagons in the deep blue.

    The panels are not drawn by eye. They are the faces of a truncated
    icosahedron — the solid a football is actually stitched from — turned so one
    pentagon faces the viewer, projected flat, and reduced to the 6 pentagons
    and 10 hexagons still facing us. This matters: laying the pattern out by
    hand gives a steering wheel when the seams reach the rim and a flower when
    they stop short. Only the real solid gives a ball. Panels near the limb
    foreshorten into the dark band around the edge, which is what the far side
    of a ball looks like anyway.

    One palette, no light/dark pair. A filled gold disc holds its own against a
    light tab strip and a dark one alike; an outline would need both.
  -->
