version: 1.0.0
acceptable_tasks:
- classification
- structured_extraction
- summarization
avoid_tasks:
- creative_writing
suits:
- multi_step
- underspecified
required_capabilities:
- system_messages
model_classes:
- small
- medium
- large
- reasoning
tools_required: false
strict_json_fit: true
validation_fit: true
evidence_level: documented
tags:
- prompt-report
id: reasoning.self-ask
title: Self-ask
family: question-decomposition
description: Decide whether follow-up questions are needed, answer them, then compose the
  final answer from those sub-answers.
strong_tasks:
- research
min_calls: 1
characteristics:
  quality: 0.85
  reliability: 0.83
  latency_efficiency: 0.7
  token_efficiency: 0.68
  simplicity: 0.7
recipe:
  system: Break a hard question into the questions it depends on, then answer those.
  instructions:
  - Ask whether follow-up questions are needed.
  - Answer each from the input, or from what you know when the input does not settle it.
  - Compose the final answer.
  blocks:
  - name: procedure
    title: FOLLOW-UP QUESTIONS
    when: supplied_material
    body: 'Are follow-up questions needed to answer this? If yes, write each one and answer it using only
      the input. If no, write ''No follow-up questions needed.'' Do not give the final answer here.

      '
  - name: procedure_topic
    title: FOLLOW-UP QUESTIONS
    when: topic_only
    body: 'Are follow-up questions needed to answer this? If yes, write each one and answer it from what
      you reliably know, marking anything you are unsure of. If no, write ''No follow-up questions
      needed.'' Do not give the final answer here.

      '
  - name: input
    title: INPUT
    body: '{input}

      '
  - name: compose_task
    title: FINAL ANSWER
    body: 'After the follow-up answers, compose the final answer from them. Use nothing the
      sub-answers do not support. Give the answer alone.

      '
  - name: contract_native
    title: OUTPUT CONTRACT
    when: native_schema
    body: 'The response is constrained by a schema enforced by the runtime. Emit the object only, with
      no wrapper text.

      '
  - name: contract_embedded
    title: OUTPUT CONTRACT
    when: embedded_schema
    body: 'Return one JSON document that validates against this schema:

      {schema_json}

      Emit the JSON only. No prose, no code fences, no trailing commentary.

      '
  - name: fields
    title: FIELDS
    when: has_schema
    body: '{schema_fields}

      '
  validators:
  - json_validity
  - json_schema
  - coverage
  fallback: Answer directly if no follow-up question could be settled.
execution:
  strategy: single
benchmark_priors:
  default: 0.76
  task:research: 0.86
source:
  paper: Measuring and Narrowing the Compositionality Gap in Language Models
  authors: Press et al.
  url: https://arxiv.org/abs/2210.03350
  year: 2022
