[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-playoff"
version = "0.3.0"
description = "Prompt optimization and LLM evaluation for local LLMs: picks the prompting technique your task needs, compiles the prompt it implies, measures it on your model, and searches for a better one."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Artem Kazakov Kozlov" }]
keywords = [
  "prompt-engineering",
  "prompt-optimization",
  "prompt-techniques",
  "llm-evaluation",
  "llm-benchmark",
  "llmops",
  "evals",
  "chain-of-thought",
  "structured-output",
  "ollama",
  "local-llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
cli = [
  "rich>=14,<15",
  "typer>=0.26,<1",
]
serve = [
  "fastapi>=0.128,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.40,<1",
]
dev = [
  "prompt-playoff[cli,serve]",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]
# DSPy as an alternative optimizer search backend (MIPROv2, GEPA, BootstrapFewShot).
# litellm is pinned below 1.81 because newer releases build a Rust extension that
# needs rustc >= 1.94; drop the pin once your toolchain is newer.
dspy = [
  "dspy>=3,<4",
  "litellm<1.81",
  # MIPROv2 drives its search with optuna; without it that backend raises on the
  # third step, after already spending model calls.
  "optuna>=4,<5",
]
# Tracing to Langfuse, or to Phoenix / any OTLP collector.
tracing = [
  "langfuse>=3,<5",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]
# Importing Hugging Face corpora as benchmark datasets.
# pyarrow arrives with datasets anyway, but the parquet fallback imports it
# directly — and that fallback is the path MultiCoNER takes on datasets>=4.
huggingface = [
  "datasets>=3,<6",
  "pyarrow>=15",
]
all = [
  "prompt-playoff[cli,serve,dspy,tracing,huggingface]",
]

[project.scripts]
prompt-playoff = "prompt_playoff.entrypoint:main"

[project.urls]
Homepage = "https://github.com/KazKozDev/prompt-playoff"
Repository = "https://github.com/KazKozDev/prompt-playoff"
Issues = "https://github.com/KazKozDev/prompt-playoff/issues"
Changelog = "https://github.com/KazKozDev/prompt-playoff/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_playoff = ["data/**/*.yaml", "data/**/*.jsonl", "data/static/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
